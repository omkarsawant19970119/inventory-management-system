server:
  port: 8087

spring:
  application:
    name: user-service

    data:
      redis:
        host: localhost
        port: 6379
        timeout: 5000

  datasource:
    url: jdbc:mysql://localhost:3306/user_db
    username: root
    password: root

  config:
    import: optional:configserver:http://localhost:8888

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/,
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    com.omkar.inventory: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger - %msg%n"

jwt:
  secret: ThisIsMyVeryLongSecretKeyForInventoryManagementSystemJWT2026SpringBootProject

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus

    tracing:
      sampling:
        probability: 1.0

    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans


