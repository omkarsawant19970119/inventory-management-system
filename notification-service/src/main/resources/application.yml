server:
  port: 8093

spring:
  application:
    name: notification-service

    data:
      redis:
        host: localhost
        port: 6379
        timeout: 5000

  datasource:
    url: jdbc:mysql://localhost:3306/notification_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  config:
    import: optional:configserver:http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: ThisIsMyVeryLongSecretKeyForInventoryManagementSystemJWT2026SpringBootProject