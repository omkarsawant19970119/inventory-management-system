spring:
  application:
    name: auth-service

  config:
    import: optional:configserver:http://localhost:8888

  profiles:
    active: dev

  eureka:
    instance:
      prefer-ip-address: true
      ip-address: 127.0.0.1

jwt:
  secret: ThisIsMyVeryLongSecretKeyForInventoryManagementSystemJWT2026SpringBootProject
  expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

    operationsSorter: method

    tagsSorter: alpha