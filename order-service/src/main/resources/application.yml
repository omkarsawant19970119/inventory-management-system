server:
  port: 8085

spring:
  application:
    name: order-service

    data:
      redis:
        host: localhost
        port: 6379
        timeout: 5000

  datasource:
    url: jdbc:mysql://localhost:3306/order_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  config:
    import: optional:configserver:http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ThisIsMyVeryLongSecretKeyForInventoryManagementSystemJWT2026SpringBootProject

  resilience4j:

    circuitbreaker:

      instances:

        productService:

          slidingWindowSize: 10

          minimumNumberOfCalls: 5

          permittedNumberOfCallsInHalfOpenState: 3

          waitDurationInOpenState: 30s

          failureRateThreshold: 50

          automaticTransitionFromOpenToHalfOpenEnabled: true

        inventoryService:

          slidingWindowSize: 10

          minimumNumberOfCalls: 5

          permittedNumberOfCallsInHalfOpenState: 3

          waitDurationInOpenState: 30s

          failureRateThreshold: 50

          automaticTransitionFromOpenToHalfOpenEnabled: true



  retry:

    instances:

      productService:

        maxAttempts: 3

        waitDuration: 2s

        retryExceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.net.SocketTimeoutException

      inventoryService:

        maxAttempts: 3

        waitDuration: 2s

        retryExceptions:
          - feign.RetryableException
          - java.net.ConnectException
          - java.net.SocketTimeoutException


  ratelimiter:
    instances:

      productService:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0

      inventoryService:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0

  bulkhead:

    instances:

      productService:

        maxConcurrentCalls: 20

        maxWaitDuration: 2s

      inventoryService:

        maxConcurrentCalls: 20

        maxWaitDuration: 2s