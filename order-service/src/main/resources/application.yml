server:
  port: 8085

spring:
  application:
    name: order-service

    data:
      redis:
        host: localhost
        port: 6379
        timeout: 5000

  datasource:
    url: jdbc:mysql://localhost:3306/order_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  config:
    import: optional:configserver:http://localhost:8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ThisIsMyVeryLongSecretKeyForInventoryManagementSystemJWT2026SpringBootProject