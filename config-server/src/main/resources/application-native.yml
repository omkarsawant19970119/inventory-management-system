server:
  port: 8888

spring:
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

      eureka:
        instance:
          prefer-ip-address: true
          ip-address: 127.0.0.1
