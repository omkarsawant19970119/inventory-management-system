server:
  port: 8091

spring:
  application:
    name: reporting-service

  datasource:
    url: jdbc:mysql://localhost:3306/reporting_db
    username: root
    password: root

  config:
    import: optional:configserver:http://localhost:8888

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"